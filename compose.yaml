services:
  procthor:
    build: .
    image: procthor:latest
    platform: linux/amd64
    ports:
      - "8001:8001"
    shm_size: "2gb"
    environment:
      - DISPLAY=:99
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk-}
      - OPENAI_API_BASE=${OPENAI_API_BASE:-https://api.deepseek.com}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-deepseek-v4-flash}
    restart: unless-stopped

  
